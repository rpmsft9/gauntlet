[project]
name = "gauntlet"
version = "0.1.0"
description = "Continuous agentic red-teaming as a CI/CD gate for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Penchala" }]
keywords = ["red-team", "llm-security", "owasp-llm", "mitre-atlas", "ci-cd", "ai-security"]
dependencies = [
    "anthropic>=0.40.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gauntlet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
