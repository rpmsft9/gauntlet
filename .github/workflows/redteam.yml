name: Gauntlet Red-Team Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  red-team:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the drift log, if committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gauntlet
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      # Demo run against the bundled, intentionally-vulnerable reference agent.
      # With no ANTHROPIC_API_KEY it runs in mock mode and the gate FAILS by
      # design (the demo agent is meant to be broken). It's marked non-blocking
      # here so this repo's own CI stays green.
      #
      # >>> When you wire Gauntlet to YOUR agent, DELETE `continue-on-error`
      # >>> below so a resilience regression actually blocks the merge. <<<
      - name: Red-team gate (demo)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gauntlet run \
            --json gauntlet-report.json \
            --markdown gauntlet-report.md \
            --dashboard gauntlet-dashboard.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-report
          path: |
            gauntlet-report.json
            gauntlet-report.md
            gauntlet-dashboard.html
